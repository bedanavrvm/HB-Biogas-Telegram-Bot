name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit tracked artifacts and secret patterns
        run: |
          python scripts/audit_tracked_artifacts.py
          python -m unittest scripts.tests.test_audit_tracked_artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit==2.10.1 ruff==0.16.5

      - name: Install frontend test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Audit Python dependency vulnerabilities
        run: python scripts/check_dependency_vulnerabilities.py

      - name: Run narrow Python correctness lint
        run: ruff check config core scripts

      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-checks-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          python scripts/check_migration_graph.py
          python manage.py makemigrations --check --dry-run
          python manage.py showmigrations --plan

      - name: Check Django configuration and static assets
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-checks-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          python -m compileall config core
          python manage.py check
          python manage.py collectstatic --noinput

      - name: Check governed routes, settings, dependencies, and boundaries
        run: |
          python scripts/check_architecture_boundaries.py
          python scripts/check_miniapp_write_inventory.py
          python scripts/check_settings_env_parity.py
          python scripts/check_dependency_parity.py
          python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check and test first-party JavaScript
        run: |
          npm run check:js
          npm run test:node

      - name: Run Mini App browser tests
        run: npm run test:browser

      - name: Run Django tests with branch coverage
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-tests-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          coverage erase
          coverage run --branch --source=core manage.py test
          coverage json -o coverage.json
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python scripts/check_coverage_quality.py --base-ref "origin/${GITHUB_BASE_REF}"
          else
            python scripts/check_coverage_quality.py
          fi
          coverage report

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-coverage
          path: |
            coverage.json
            coverage-subsystems.json
          if-no-files-found: warn

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore

      - name: Check Apps Script syntax
        run: |
          for script in *.gs; do
            cp "$script" "/tmp/${script%.gs}.js"
            node --check "/tmp/${script%.gs}.js"
          done
