name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-engineering-checks-only-not-a-production-secret
      DATABASE_URL: sqlite:///ci-test.sqlite3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit tracked artifacts and secret patterns
        run: |
          python scripts/audit_tracked_artifacts.py
          python -m unittest scripts.tests.test_audit_tracked_artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-audit==2.10.1 ruff==0.16.5

      - name: Install frontend test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Audit Python dependency vulnerabilities
        run: python scripts/check_dependency_vulnerabilities.py

      - name: Run narrow Python correctness lint
        run: ruff check config core origination scripts credit_assessments hb_operations payments portal_recognition requisitions tat_recognition qa_tracker ui_review staff_auth

      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-checks-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          python scripts/check_migration_graph.py
          python manage.py makemigrations --check --dry-run
          python manage.py showmigrations --plan

      - name: Check Django configuration and static assets
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-checks-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          python -m compileall config core origination ui_review staff_auth
          python manage.py check
          python manage.py collectstatic --noinput

      - name: Check governed routes, settings, dependencies, and boundaries
        run: |
          python scripts/check_architecture_boundaries.py
          python scripts/check_ui_standard.py
          python scripts/check_database_governance.py
          python manage.py generate_database_catalog --check
          python scripts/check_miniapp_write_inventory.py
          python scripts/check_settings_env_parity.py
          python scripts/check_dependency_parity.py
          python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check and test first-party JavaScript
        run: |
          npm run check:js
          npm run test:node

      - name: Run Mini App browser tests
        run: npm run test:browser

      - name: Capture synthetic current UI review specimens
        if: ${{ !cancelled() }}
        env:
          UI_AUDIT_SCENES: queue
          UI_AUDIT_STATES: one
        run: |
          python manage.py export_ui_audit
          node scripts/capture_ui_audit.js test-results/ui-audit

      - name: Upload unapproved synthetic UI audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-design-audit-unapproved
          path: test-results/ui-audit/
          retention-days: 14
          if-no-files-found: warn

      - name: Run Django tests with branch coverage
        env:
          DJANGO_SECRET_KEY: ci-secret-key-for-tests-only-change-in-production
          DEBUG: "True"
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          coverage erase
          coverage run --branch --source=core,origination,credit_assessments,hb_operations,payments,portal_recognition,requisitions,tat_recognition,qa_tracker,ui_review,staff_auth manage.py test
          coverage json -o coverage.json
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            python scripts/check_coverage_quality.py --base-ref "origin/${GITHUB_BASE_REF}"
          else
            python scripts/check_coverage_quality.py
          fi
          coverage report

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subsystem-coverage
          path: |
            coverage.json
            coverage-subsystems.json
          if-no-files-found: warn

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check Apps Script syntax
        run: |
          for script in *.gs; do
            cp "$script" "/tmp/${script%.gs}.js"
            node --check "/tmp/${script%.gs}.js"
          done

  browser-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser/package-lock.json
      - name: Install isolated browser and existing test tooling
        run: |
          npm ci --ignore-scripts
          npm --prefix browser ci
          npx playwright install --with-deps chromium
      - name: Verify exact graph, components, types and source review
        run: |
          npm --prefix browser run check:dependencies
          node browser/scripts/check-context.cjs
          npm --prefix browser run typecheck
          npm --prefix browser run lint
          npm --prefix browser audit
          python scripts/check_ui_standard.py
          python -m unittest scripts.tests.test_ads_browser_preview scripts.tests.test_ui_standard
      - name: Build and exercise synthetic ADS access pages
        run: |
          npm --prefix browser run build
          python scripts/serve_ads_browser_preview.py &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(40):
              try:
                  with urlopen('http://127.0.0.1:8766/', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit('ADS preview did not start')
          PY
          node scripts/test_ads_browser_preview.js
      - name: Retain unapproved synthetic ADS review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ads-access-preview-unapproved
          path: test-results/ads-browser-preview/
          retention-days: 14
          if-no-files-found: warn

      - name: Install the existing Django backend for closed transport tests
        run: pip install -r requirements.txt
      - name: Build and exercise the closed React to native Django boundary
        env:
          DEBUG: "True"
          DJANGO_SECRET_KEY: ci-closed-browser-tests-only-not-a-production-secret
          DATABASE_URL: "sqlite:///:memory:"
          GOOGLE_SERVICE_ACCOUNT_JSON: ""
          GOOGLE_APPLICATION_CREDENTIALS: ""
          SENTRY_DSN: ""
          RUN_STAFF_BROWSER_E2E: "1"
        run: |
          node browser/scripts/build.cjs --authentication
          node browser/scripts/build.cjs --authentication --development
          python manage.py test staff_auth.tests_transport --settings=staff_auth.transport_test_settings --noinput
          node browser/scripts/build.cjs --complaints
          node browser/scripts/build.cjs --complaints --development
          python manage.py test core.tests_browser_complaints staff_auth.tests_complaints_transport --settings=staff_auth.transport_test_settings --noinput
          node scripts/test_workspace_navigation.js
          node scripts/test_workspace_recovery.js
          node browser/scripts/build.cjs --complaints-operations
          node browser/scripts/build.cjs --complaints-operations --development
          python manage.py test core.tests_browser_complaint_operations staff_auth.tests_complaints_operations_transport --settings=staff_auth.transport_test_settings --noinput
      - name: Build and exercise the persistent synthetic Complaints demo
        run: |
          node browser/scripts/build.cjs --complaints-demo
          node browser/scripts/build.cjs --complaints-demo --development
          python -m unittest scripts.tests.test_complaints_demo scripts.tests.test_complaints_demo_sandbox
          python scripts/serve_complaints_demo.py &
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8767/ > /dev/null
          python scripts/serve_complaints_demo.py --development --port 8768 &
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8768/ > /dev/null
          node scripts/test_complaints_demo.js
          node scripts/test_complaints_demo.js --development
      - name: Retain proof-free closed transport evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-browser-native-transport-unapproved
          path: |
            test-results/staff-browser-transport/
            test-results/complaints-browser-transport/
            test-results/complaints-browser-operations/
            test-results/complaints-local-demo/production/
            test-results/complaints-local-demo/development/
          retention-days: 14
          if-no-files-found: warn

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jbl_test_runner
          POSTGRES_PASSWORD: ci-disposable-test-password
          POSTGRES_DB: jbl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jbl_test_runner -d jbl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: ci-postgres-only-not-a-production-secret
      DJANGO_SETTINGS_MODULE: config.settings_test_postgres
      TEST_DATABASE_URL: postgresql://jbl_test_runner:ci-disposable-test-password@127.0.0.1:5432/jbl_test
      DATABASE_URL: sqlite:///unused-ci.sqlite3
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fresh schema and production-shaped tests
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
          python manage.py test origination core.tests_reliability core.tests_portal_publication_scheduler core.tests_portal_engineering core.tests_pipeline.JblPipelineServiceTestCase payments hb_operations requisitions ui_review staff_auth --noinput --verbosity 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Build and test real browser routes on PostgreSQL
        env:
          RUN_STAFF_BROWSER_E2E: "1"
          STAFF_BROWSER_TEST_NODE: node
        run: |
          npm ci
          npm --prefix browser ci --include=dev
          npx playwright install --with-deps chromium
          npm --prefix browser run typecheck
          npm --prefix browser run lint
          node browser/scripts/build.cjs --complaints-operations --production-browser
          python manage.py test staff_auth.tests_production staff_auth.tests_production_transport staff_auth.tests_security_cache staff_auth.tests_abuse staff_auth.tests_enrollment staff_auth.tests_browser_api staff_auth.tests_initial_setup --settings=staff_auth.acceptance_test_settings --noinput
      - name: Retain synthetic production-route evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: complaints-production-route-tests
          path: |
            test-results/browser-production-native/
            test-results/complaints-browser-operations/dist-production/
          retention-days: 14
          if-no-files-found: warn
