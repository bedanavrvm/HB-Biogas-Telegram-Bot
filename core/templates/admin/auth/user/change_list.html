{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {% if request.user.is_superuser %}
    <a href="{% url 'admin:auth_user_migrate_legacy_staff' %}" class="button">
      Migrate existing staff
    </a>
    <a href="{% url 'admin:auth_user_migrate_legacy_staff' %}#enroll-telegram-user" class="button">
      Enroll Telegram user
    </a>
    <a href="{% url 'admin:auth_user_add' %}?account_type=django" class="button">
      Add Django login user
    </a>
  {% endif %}
  {{ block.super }}
{% endblock %}
