{% extends "admin/base_site.html" %}
{% block content %}<div id="content-main" class="max-w-2xl rounded border border-base-200 bg-white p-5 shadow-sm dark:border-base-800 dark:bg-base-900"><h1 class="text-xl font-semibold">{{ title }}</h1><p class="mt-2 text-sm">This creates a new pending request from the state before the original change. It does not restore access until a different designated approver applies it.</p><form method="post" class="mt-4">{% csrf_token %}<label class="block text-sm font-medium">Reason<textarea required name="reason" rows="3" class="mt-1 block w-full"></textarea></label><button class="mt-4 min-h-11 rounded bg-primary-600 px-4 font-medium text-white">Submit rollback for approval</button></form></div>{% endblock %}
