<section class="osw-subsection" data-osw-formset data-prefix="{{ formset.prefix }}"><div class="osw-section-title"><h3>{{ title }}</h3><button type="button" class="osw-secondary" data-add-row>Add row</button></div>{{ formset.management_form }}{{ formset.non_form_errors }}<div class="osw-repeat-grid" data-formset-rows>{% for child in formset %}<article>{{ child.id }}<div class="osw-form-grid">{% for field in child.visible_fields %}<div class="osw-field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}</div></article>{% endfor %}</div><template data-empty-form><article>{{ formset.empty_form.id }}<div class="osw-form-grid">{% for field in formset.empty_form.visible_fields %}<div class="osw-field">{{ field.label_tag }}{{ field }}</div>{% endfor %}</div></article></template></section>
