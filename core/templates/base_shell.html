{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JBL Pipeline Portal">
  <title>{% block title %}Jawabu Portal{% endblock %}</title>
  <script>
    window.PORTAL_CONFIG = {
      invoiceUploadMaxFileSizeMb: {{ invoice_upload_max_file_size_mb|default:8 }},
      farmupMaxFileSizeMb: {{ farmup_max_file_size_mb|default:5 }},
      farmupAgGridScript: "{% static 'miniapp/vendor-ag-grid-community-36.1.0.min.js' %}",
      farmupAgGridStyles: [
        "{% static 'miniapp/vendor-ag-grid-community-36.1.0.min.css' %}",
        "{% static 'miniapp/vendor-ag-grid-quartz-font-36.1.0.min.css' %}",
        "{% static 'miniapp/vendor-ag-grid-theme-quartz-36.1.0.min.css' %}"
      ]
    };
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="{% static 'miniapp/vendor-htmx-2.0.4.min.js' %}?v=2.0.4"></script>
  <script src="{% static 'miniapp/vendor-lucide-1.44.0.min.js' %}?v=1.44.0"></script>
  <link rel="stylesheet" href="{% static 'miniapp/vendor-leaflet-1.9.4.css' %}?v=1.9.4">
  <script src="{% static 'miniapp/vendor-leaflet-1.9.4.js' %}?v=1.9.4"></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=8">
  <link rel="stylesheet" href="{% static 'miniapp/portal.css' %}?v=96">
  <link rel="stylesheet" href="{% static 'miniapp/workflow_standard.css' %}?v=17">
  <link rel="stylesheet" href="{% static 'miniapp/theme.css' %}?v=9">
  <script defer src="{% static 'miniapp/miniapp-nav.js' %}?v=21"></script>
</head>
<body class="workflow-standard portal-app">
  <header class="app-shell-header">
    <button id="shell-menu-button" class="shell-menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <i data-lucide="menu"></i>
    </button>
    <div class="shell-title"><h1>Pipeline Portal</h1><p>JBL HomeBiogas</p></div>
    <div class="shell-actor" role="status" aria-live="polite">
      <span class="portal-connection-dot" aria-hidden="true"></span>
      <span class="shell-actor-copy"><strong id="portal-actor-name">Connecting</strong><span id="portal-actor-role"></span></span>
      <span id="portal-freshness">Loading current data</span>
    </div>
  </header>

  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

  <aside id="sidebar" class="app-sidebar">
    <nav aria-label="Portal screens"
         hx-get="{% url 'portal_navigation' %}?active={{ active_screen }}&amp;surface=sidebar"
         hx-trigger="load"
         hx-swap="innerHTML">
      <span class="shell-nav-status">Loading navigation...</span>
    </nav>
  </aside>

  <main id="content"
        hx-target="this"
        hx-swap="innerHTML transition:true">
    {% block content %}{% endblock %}
  </main>

  <nav id="bottom-tabs" class="app-bottom-tabs" aria-label="Portal tabs"
       hx-get="{% url 'portal_navigation' %}?active={{ active_screen }}&amp;surface=bottom"
       hx-trigger="load"
       hx-swap="innerHTML">
    <span class="shell-nav-status">Loading...</span>
  </nav>

  {% include "miniapp_diagnostics.html" %}
  <script src="{% static 'miniapp/utils.js' %}?v=12"></script>
  <script src="{% static 'miniapp/runtime.js' %}?v=4"></script>
  <script src="{% static 'miniapp/portal_dialogs.js' %}?v=1"></script>
  <script src="{% static 'miniapp/secure_media_viewer.js' %}?v=1"></script>
  <script src="{% static 'miniapp/portal_helpers.js' %}?v=7"></script>
  <script src="{% static 'miniapp/portal_api.js' %}?v=9"></script>
  <script src="{% static 'miniapp/portal_queues.js' %}?v=9"></script>
  <script src="{% static 'miniapp/portal_farmer_sheet.js' %}?v=61"></script>
  <script src="{% static 'miniapp/portal_case_history.js' %}?v=1"></script>
  <script src="{% static 'miniapp/portal_filters.js' %}?v=11"></script>
  <script src="{% static 'miniapp/portal_requisitions.js' %}?v=34"></script>
  <script src="{% static 'miniapp/portal_invoices.js' %}?v=16"></script>
  <script src="{% static 'miniapp/portal_payments.js' %}?v=7"></script>
  <script src="{% static 'miniapp/portal_imports.js' %}?v=7"></script>
  <script src="{% static 'miniapp/portal_farmup.js' %}?v=3"></script>
  <!-- Pinned local asset: Chart.js 4.5.1; no runtime CDN dependency. -->
  <script src="{% static 'miniapp/vendor-chartjs-4.5.1.umd.min.js' %}?v=4.5.1"></script>
  <script src="{% static 'miniapp/portal_reports.js' %}?v=14"></script>
  <script src="{% static 'miniapp/portal.js' %}?v=78"></script>
</body>
</html>
