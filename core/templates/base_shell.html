{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JBL Pipeline Portal">
  <title>{% block title %}Jawabu Portal{% endblock %}</title>
  <script>
    window.PORTAL_CONFIG = {invoiceUploadMaxFileSizeMb: {{ invoice_upload_max_file_size_mb|default:8 }}};
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=6">
  <link rel="stylesheet" href="{% static 'miniapp/portal.css' %}?v=61">
  <link rel="stylesheet" href="{% static 'miniapp/workflow_standard.css' %}?v=16">
  <link rel="stylesheet" href="{% static 'miniapp/theme.css' %}?v=9">
  <script defer src="{% static 'miniapp/miniapp-nav.js' %}?v=19"></script>
</head>
<body class="workflow-standard portal-app">
  <div id="shell-progress" class="shell-progress htmx-indicator" role="progressbar" aria-label="Loading"></div>
  <header class="app-shell-header">
    <button id="shell-menu-button" class="shell-menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <i data-lucide="menu"></i>
    </button>
    <div class="shell-title"><h1>Pipeline Portal</h1><p>JBL HomeBiogas</p></div>
  </header>

  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

  <aside id="sidebar" class="app-sidebar">
    <nav aria-label="Portal screens"
         hx-get="{% url 'portal_navigation' %}?active={{ active_screen }}&amp;surface=sidebar"
         hx-trigger="load"
         hx-swap="innerHTML">
      <span class="shell-nav-status">Loading navigation...</span>
    </nav>
  </aside>

  <main id="content"
        hx-target="this"
        hx-swap="innerHTML transition:true"
        hx-indicator="#shell-progress">
    {% block content %}{% endblock %}
  </main>

  <nav id="bottom-tabs" class="app-bottom-tabs" aria-label="Portal tabs"
       hx-get="{% url 'portal_navigation' %}?active={{ active_screen }}&amp;surface=bottom"
       hx-trigger="load"
       hx-swap="innerHTML">
    <span class="shell-nav-status">Loading...</span>
  </nav>

  <script src="{% static 'miniapp/utils.js' %}?v=4"></script>
  <script src="{% static 'miniapp/portal_helpers.js' %}?v=5"></script>
  <script src="{% static 'miniapp/portal_api.js' %}?v=6"></script>
  <script src="{% static 'miniapp/portal_queues.js' %}?v=8"></script>
  <script src="{% static 'miniapp/portal_farmer_sheet.js' %}?v=31"></script>
  <script src="{% static 'miniapp/portal_filters.js' %}?v=8"></script>
  <script src="{% static 'miniapp/portal_requisitions.js' %}?v=33"></script>
  <script src="{% static 'miniapp/portal_invoices.js' %}?v=15"></script>
  <script src="{% static 'miniapp/portal_payments.js' %}?v=7"></script>
  <script src="{% static 'miniapp/portal_imports.js' %}?v=6"></script>
  <!-- Pinned local asset: Chart.js 4.5.1; no runtime CDN dependency. -->
  <script src="{% static 'miniapp/vendor-chartjs-4.5.1.umd.min.js' %}?v=4.5.1"></script>
  <script src="{% static 'miniapp/portal_reports.js' %}?v=11"></script>
  <script src="{% static 'miniapp/portal.js' %}?v=63"></script>
</body>
</html>
