{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JBL Pipeline Portal">
  <title>{% block title %}Jawabu Portal{% endblock %}</title>
  <script>
    window.PORTAL_CONFIG = {
      invoiceUploadMaxFileSizeMb: {{ invoice_upload_max_file_size_mb|default:8 }},
      farmupMaxFileSizeMb: {{ farmup_max_file_size_mb|default:5 }},
      farmupAgGridScript: "{% static 'miniapp/vendor-ag-grid-community-36.1.0.min.js' %}",
      farmupAgGridStyles: [
        "{% static 'miniapp/vendor-ag-grid-community-36.1.0.min.css' %}",
        "{% static 'miniapp/vendor-ag-grid-quartz-font-36.1.0.min.css' %}",
        "{% static 'miniapp/vendor-ag-grid-theme-quartz-36.1.0.min.css' %}"
      ],
      leafletScript: "{% static 'miniapp/vendor-leaflet-1.9.4.js' %}?v=1.9.4",
      leafletStyles: "{% static 'miniapp/vendor-leaflet-1.9.4.css' %}?v=1.9.4"
    };
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="{% static 'miniapp/vendor-htmx-2.0.4.min.js' %}?v=2.0.4"></script>
  <script src="{% static 'miniapp/vendor-lucide-1.44.0.min.js' %}?v=1.44.0"></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=8">
  <link rel="stylesheet" href="{% static 'miniapp/activity_changes.css' %}?v=1">
  <script src="{% static 'miniapp/activity_changes.js' %}?v=1"></script>
  <link rel="stylesheet" href="{% static 'miniapp/components.css' %}?v=3">
  <link rel="stylesheet" href="{% static 'miniapp/portal.css' %}?v=150">
  <link rel="stylesheet" href="{% static 'miniapp/workflow_standard.css' %}?v=18">
  <link rel="stylesheet" href="{% static 'miniapp/theme.css' %}?v=10">
  <script defer src="{% static 'miniapp/miniapp-nav.js' %}?v=28"></script>
</head>
<body class="workflow-standard portal-app">
  <header class="app-shell-header">
    <div class="portal-header-brand">
      <button id="shell-menu-button" class="shell-menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <i data-lucide="menu"></i>
      </button>
      <div class="shell-title"><h1>Pipeline Portal</h1><p>JBL HomeBiogas</p></div>
    </div>
    <div class="portal-header-actions">
      <button id="portal-notification-button" class="portal-notification-button" type="button" aria-label="Work needing attention" aria-controls="portal-notification-panel" aria-expanded="false">
        <i data-lucide="bell" aria-hidden="true"></i><span id="portal-notification-count" hidden>0</span>
      </button>
      <div class="shell-actor" role="status" aria-live="polite">
        <span class="portal-connection-dot" aria-hidden="true"></span>
        <span class="portal-connection-label">Active</span>
        <span class="shell-actor-copy"><strong id="portal-actor-name">Connecting</strong><span id="portal-actor-role" hidden></span></span>
        <span id="portal-freshness" hidden></span>
      </div>
    </div>
  </header>
  <section id="portal-notification-panel" class="portal-notification-panel" aria-labelledby="portal-notification-title" hidden>
    <header class="miniapp-panel-heading"><h2 id="portal-notification-title">Needs your input</h2><button id="portal-notification-close" class="miniapp-icon-button" type="button" aria-label="Close notifications"><i data-lucide="x" aria-hidden="true"></i></button></header>
    <div id="portal-notification-list" class="miniapp-scroll-body" data-inbox-list></div>
    <nav id="portal-notification-pagination" class="miniapp-pagination" aria-label="Notification pages" data-inbox-pagination hidden>
      <button id="portal-notification-prev" type="button" aria-label="Previous notifications" data-inbox-prev><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <span id="portal-notification-range" role="status" aria-live="polite" data-inbox-range></span>
      <button id="portal-notification-next" type="button" aria-label="Next notifications" data-inbox-next><i data-lucide="chevron-right" aria-hidden="true"></i></button>
    </nav>
  </section>

  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

  <aside id="sidebar" class="app-sidebar">
    <nav aria-label="Portal screens"
         hx-get="{% url 'portal_navigation' %}?active={{ active_screen }}&amp;surface=sidebar"
         hx-trigger="load"
         hx-swap="innerHTML">
      <span class="shell-nav-status">Loading navigation...</span>
    </nav>
  </aside>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  {% include "miniapp_diagnostics.html" %}
  <script src="{% static 'miniapp/utils.js' %}?v=20"></script>
  <script src="{% static 'miniapp/components.js' %}?v=4"></script>
  <script src="{% static 'miniapp/asset_loader.js' %}?v=1"></script>
  <script src="{% static 'miniapp/runtime.js' %}?v=4"></script>
  <script src="{% static 'miniapp/portal_dialogs.js' %}?v=2"></script>
  <script src="{% static 'miniapp/secure_media_viewer.js' %}?v=1"></script>
  <script src="{% static 'miniapp/portal_helpers.js' %}?v=12"></script>
  <script src="{% static 'miniapp/portal_api.js' %}?v=11"></script>
  <script src="{% static 'miniapp/portal_queues.js' %}?v=15"></script>
  <script src="{% static 'miniapp/portal_farmer_sheet.js' %}?v=82"></script>
  <script src="{% static 'miniapp/portal_case_history.js' %}?v=1"></script>
  <script src="{% static 'miniapp/portal_filters.js' %}?v=20"></script>
  <script src="{% static 'miniapp/portal_case_navigation.js' %}?v=4"></script>
  <script src="{% static 'miniapp/portal_requisitions.js' %}?v=44"></script>
  <script src="{% static 'miniapp/portal_invoices.js' %}?v=34"></script>
  <script src="{% static 'miniapp/portal_payments.js' %}?v=25"></script>
<script src="{% static 'miniapp/portal_hb_actions.js' %}?v=17"></script>
  <script src="{% static 'miniapp/portal_imports.js' %}?v=14"></script>
  <script src="{% static 'miniapp/portal_farmup.js' %}?v=16"></script>
  <script src="{% static 'miniapp/portal_curated_reports.js' %}?v=4"></script>
  <script src="{% static 'miniapp/portal_recognition.js' %}?v=3"></script>
  <script src="{% static 'miniapp/portal.js' %}?v=113"></script>
</body>
</html>
