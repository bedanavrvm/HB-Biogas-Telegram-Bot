<section class="portal-queue-tools" data-portal-queue-tools="{{ queue_key }}" aria-label="{{ queue_label|default:'Queue' }} search and filters">
  <div class="portal-queue-tools-primary">
    <label class="portal-queue-search" aria-label="Search {{ queue_label|default:'queue' }}">
      <i data-lucide="search" aria-hidden="true"></i>
      <input type="search" data-portal-queue-search="{{ queue_key }}" placeholder="{{ search_placeholder|default:'Search name, ID, phone, county, or branch' }}" autocomplete="off" enterkeyhint="search">
      <button type="button" data-portal-search-clear aria-label="Clear search" title="Clear search" hidden><i data-lucide="x" aria-hidden="true"></i></button>
    </label>
    <button type="button" class="miniapp-filter-trigger" data-portal-filter-trigger aria-label="Filter cases">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l-6 7v7l-4 2v-9z"></path></svg>
      <span>Filters</span>
      <span class="miniapp-filter-count" data-portal-filter-count hidden>0</span>
    </button>
  </div>
  <div class="miniapp-filter-chips" data-portal-filter-chips aria-live="polite"></div>
  <div class="miniapp-sheet-overlay" data-portal-filter-overlay aria-hidden="true" hidden>
    <aside class="miniapp-sheet" data-portal-filter-sheet role="dialog" aria-modal="true" aria-label="Filter {{ queue_label|default:'queue' }}">
      <header class="miniapp-sheet-header">
        <div><strong>Filter cases</strong><p data-portal-matching-count role="status" aria-live="polite">Choose filters to narrow this queue.</p></div>
        <button type="button" data-miniapp-sheet-close aria-label="Close filters"><i data-lucide="x" aria-hidden="true"></i></button>
      </header>
      <form class="miniapp-sheet-body" data-portal-filter-form>
        <fieldset class="portal-filter-options" data-portal-filter-group="county"><legend>County</legend><div data-portal-filter-options="county"></div></fieldset>
        <fieldset class="portal-filter-options" data-portal-filter-group="branch"><legend>Branch</legend><div data-portal-filter-options="branch"></div></fieldset>
        {% if queue_key == 'all' %}
        <fieldset class="portal-filter-options" data-portal-filter-group="status"><legend>Status</legend><div data-portal-filter-options="status"></div></fieldset>
        {% endif %}
        <fieldset class="portal-filter-options portal-filter-date-range" data-portal-filter-group="hbg_visit_date"><legend>HB visit date</legend><div class="portal-filter-date-inputs"><label>From<input type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="DD-MM-YYYY" name="hbg_visit_date_from" data-portal-date-filter></label><label>To<input type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="DD-MM-YYYY" name="hbg_visit_date_to" data-portal-date-filter></label></div></fieldset>
        <fieldset class="portal-filter-options portal-filter-date-range" data-portal-filter-group="jbl_visit_date"><legend>JBL visit date</legend><div class="portal-filter-date-inputs"><label>From<input type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="DD-MM-YYYY" name="jbl_visit_date_from" data-portal-date-filter></label><label>To<input type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="DD-MM-YYYY" name="jbl_visit_date_to" data-portal-date-filter></label></div></fieldset>
        <label>Show<select name="ordering"><option value="">Needs attention first</option><option value="newest">Newest first</option></select></label>
        <footer class="miniapp-sheet-actions">
          <button type="button" class="btn btn-secondary" data-portal-filter-reset>Reset</button>
          <button type="button" class="btn btn-primary" data-miniapp-sheet-close>Done</button>
        </footer>
      </form>
    </aside>
  </div>
</section>
