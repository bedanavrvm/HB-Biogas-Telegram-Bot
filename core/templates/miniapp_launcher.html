{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>JBL Apps</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=15">
  <link rel="stylesheet" href="{% static 'miniapp/miniapp_launcher.css' %}?v=1">
</head>
<body>
  <main class="apps-shell">
    <header><img src="{% static 'miniapp/jawabu-logo.png' %}" alt="Jawabu"><h1>JBL Apps</h1><button id="apps-refresh" type="button" aria-label="Refresh apps" title="Refresh apps"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button></header>
    <p id="apps-status" role="status" aria-live="polite">Loading your apps…</p>
    <section id="apps-list" aria-label="Your apps"></section>
  </main>
  <script src="{% static 'miniapp/utils.js' %}?v=27"></script>
  <script src="{% static 'miniapp/miniapp_launcher.js' %}?v=1"></script>
</body>
</html>
