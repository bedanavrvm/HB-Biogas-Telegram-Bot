{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Activate JBL staff access</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=8">
  <link rel="stylesheet" href="{% static 'miniapp/workflow_standard.css' %}?v=17">
  <style>
    body{background:var(--bg-base);color:var(--text-primary);margin:0;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom));font-family:system-ui,sans-serif}
    .activation{max-width:440px;margin:8vh auto;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-color);border-radius:14px;padding:1.25rem}
    .activation small{color:var(--text-muted);font-size:11px;font-weight:650;letter-spacing:.06em}
    .activation h1{margin:8px 0;color:var(--text-primary)}
    .activation p{color:var(--text-primary);font-size:14px;line-height:1.6;margin:0 0 1rem}
    .activation label{display:block;color:var(--text-primary);margin-bottom:6px;font-size:13px}
    .activation input,.activation button{width:100%;min-height:48px;box-sizing:border-box;border-radius:9px}
    .activation input{border:1px solid color-mix(in srgb,var(--text-muted) 65%,var(--bg-surface));background:var(--bg-base);color:var(--text-primary);caret-color:var(--brand-primary);padding:.75rem;font-size:1.2rem;letter-spacing:.2rem}
    .activation input:focus-visible{outline:2px solid var(--brand-primary);outline-offset:2px}
    .activation button{border:0;background:var(--brand-primary);color:var(--brand-primary-text);font-weight:700;margin-top:1rem}
    .activation button:hover:not(:disabled){background:var(--brand-primary-hover);color:var(--brand-primary-text)}
    .activation button:focus-visible{outline:2px solid var(--brand-primary);outline-offset:3px}
    .activation button:disabled{opacity:.65}
    .activation-status{margin-top:1rem;padding:.7rem;border:1px solid var(--border-color);border-radius:8px;font-size:14px;line-height:1.5}
    .activation-status[hidden]{display:none}
    .activation-status.error{background:var(--status-danger-bg);color:var(--status-danger);border-color:var(--status-danger)}
    .activation-status.success{background:var(--status-success-bg);color:var(--status-success);border-color:var(--status-success)}
  </style>
</head>
<body>
  <main class="activation">
    <small>JBL FIELD WORKFLOW</small>
    <h1>Activate staff access</h1>
    <p>Enter the eight-digit code your administrator gave you. It expires after 15 minutes and works once.</p>
    <form id="activation-form">
      <label for="activation-code"><strong>Activation code</strong></label>
      <input id="activation-code" name="activation_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]{8}" required>
      <button id="activate-button" type="submit">Verify identity</button>
    </form>
    <div id="activation-status" class="activation-status" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="{% static 'miniapp/utils.js' %}?v=12"></script>
  <script>
  (function(){
    const utils=window.MiniAppUtils||{},tg=utils.initTelegram?utils.initTelegram():(window.Telegram&&window.Telegram.WebApp);
    utils.bindMiniAppTheme?.(tg);
    const form=document.getElementById('activation-form'),button=document.getElementById('activate-button'),status=document.getElementById('activation-status');
    document.getElementById('activation-code').addEventListener('input',function(){utils.setCloseProtection?.('staff-activation-code',Boolean(this.value));});
    function closeAfterActivation(){if(tg&&typeof tg.close==='function'){window.setTimeout(function(){tg.close();},600);}}
    let activationRequestId='';
    form.addEventListener('submit',async function(event){event.preventDefault();button.disabled=true;button.textContent='Verifying…';status.hidden=true;utils.setCloseProtection?.('staff-activation-submit',true);activationRequestId=activationRequestId||utils.createRequestId?.('staff-activation')||('staff-activation-'+Date.now());
      try{const response=await fetch('{% url "staff_telegram_activation_submit" %}',{method:'POST',headers:{'Content-Type':'application/json',...utils.idempotencyHeaders?.(activationRequestId)},body:JSON.stringify({init_data:tg?tg.initData:'',activation_code:document.getElementById('activation-code').value,client_request_id:activationRequestId})});const body=await response.json();status.textContent=body.message||'Activation could not be completed.';status.className='activation-status '+(response.ok?'success':'error');status.hidden=false;if(response.ok){utils.setCloseProtection?.('staff-activation-code',false);button.textContent='Verified';activationRequestId='';closeAfterActivation();return;}}
      catch(_){status.textContent='The connection failed. Check your network and try again.';status.className='activation-status error';status.hidden=false;}finally{utils.setCloseProtection?.('staff-activation-submit',false);}button.disabled=false;button.textContent='Verify identity';
    });
  })();
  </script>
</body>
</html>
