{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JBL paperless loan origination">
  <title>Loan Origination</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="{% static 'miniapp/base.css' %}?v=6">
  <link rel="stylesheet" href="{% static 'miniapp/workflow_standard.css' %}?v=16">
  <link rel="stylesheet" href="{% static 'miniapp/loan_origination.css' %}?v=20260814-1">
</head>
<body class="workflow-standard origination-app" data-miniapp="loan-origination" data-ui-version="20260814-1">
  <main class="origination-shell">
    <header class="origination-header">
      <img class="workflow-brand" src="{% static 'miniapp/jawabu-logo.png' %}" alt="Jawabu">
      <div>
        <p class="eyebrow">JBL field workflow</p>
        <h1>Loan Origination</h1>
        <p>Capture, review and prepare paperless applications</p>
      </div>
      <button type="button" class="header-icon" id="origination-refresh" aria-label="Refresh applications" title="Refresh applications">↻</button>
    </header>
    <div id="origination-root" aria-live="polite" aria-busy="true">
      <div class="empty-state"><div class="spinner-inline"></div><div class="es-sub">Loading applications...</div></div>
    </div>
  </main>
  <div id="document-preview-overlay" class="preview-overlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <header class="preview-header"><div><strong>Filled loan document</strong><small id="preview-page">Loading preview…</small></div><button id="preview-close" class="icon-button" type="button" aria-label="Close preview">×</button></header>
    <div class="preview-toolbar"><button id="preview-previous" type="button">← Page</button><button id="preview-next" type="button">Page →</button><button id="preview-regenerate" type="button" class="preview-icon-action" aria-label="Regenerate preview" title="Regenerate preview">↻</button><button id="preview-zoom-out" type="button">−</button><span id="preview-zoom">100%</span><button id="preview-zoom-in" type="button">+</button><button id="preview-open" type="button">Open</button></div>
    <div id="document-preview-stage" class="preview-stage"><img id="document-preview-image" alt="Filled loan application preview"></div>
  </div>
  <div id="origination-review-overlay" class="review-overlay" role="dialog" aria-modal="true" aria-hidden="true" hidden>
    <form id="origination-review-dialog" class="review-dialog">
      <header><div><p class="eyebrow">Maker-checker review</p><h2 id="review-dialog-title">Request corrections</h2></div><button type="button" class="icon-button" id="review-dialog-close" aria-label="Close review dialog">×</button></header>
      <p id="review-dialog-hint"></p>
      <div id="review-dialog-targets" class="review-dialog-targets"></div>
      <label><span>Overall instruction or reason</span><textarea id="review-dialog-summary" maxlength="2000" required></textarea></label>
      <footer><button type="button" class="btn btn-secondary" id="review-dialog-cancel">Cancel</button><button type="submit" class="btn btn-primary" id="review-dialog-submit">Record decision</button></footer>
    </form>
  </div>
  <div id="origination-toast" class="origination-toast" role="status" aria-live="polite" hidden></div>
  <script src="{% static 'miniapp/utils.js' %}?v=4"></script>
  <script src="{% static 'miniapp/loan_origination.js' %}?v=20260814-1"></script>
</body>
</html>
