<nav class="osw-task-list" aria-label="Product tasks">{% for task in tasks %}<a class="osw-card osw-task {{ task.status }}" href="{{ task.url }}" data-task="{{ task.key }}" {% if task.key == step_key %}aria-current="page"{% endif %}><span><b>{{ task.label }}</b><small data-task-detail>{{ task.detail }}</small></span><span class="osw-status" data-task-status>{{ task.status_label }}</span></a>{% endfor %}</nav>
